# ops/REGISTRY/entities.yaml
#
# 實體 registry 骨架（BACKLOG B-007）。
# 依 ENTITIES.md P1（名稱不是識別）／P2（三態）／P3（合併須舉證）／P4（斷言綁 ID）／P6（對齊既有權威檔，不自建）。
#
# 範圍：ENTITIES.md §2.1 列出的七個高風險同名詞——都蘭／卑南／知本／長濱／大武／太麻里／成功。
# 這是骨架，不是定論：多數 entity 的官方權威代碼（原民會部落代碼、THCTS 地名代碼）今天無法取得
# （見下方「本輪權威檔查證狀態」），故 authority_ref 多數為 null，待下一輪權威網站恢復後補上。
#
# indigenous: true 的條目（族群名、部落名、族語詞）依 HARD-RULES H9–H11，本檔案整體採 T3，
# 不得自動 commit 到 main，須開 PR（CHARTER §3）。

meta:
  version: "0.1-skeleton"
  created: 2026-08-10
  created_by: agent
  status: skeleton              # skeleton = 結構已建，多數 entity 尚待權威檔核實
  backlog_ref: B-007

# ─────────────────────────────────────────────
# 本輪權威檔查證狀態（2026-08-10）
# ─────────────────────────────────────────────
# P6 要求對齊既有權威檔而非自建。本輪嘗試對齊，但：
#   - 原民會核定部落名冊頁面（cip.gov.tw）：HTTP 503（連續重試 2 次，見 JOURNAL 2026-08-10）
#   - THCTS 實際查詢平台（thcts.sinica.edu.tw，非說明頁）：HTTP 503
#   - 中研院 GIS tileserver（gis.sinica.edu.tw/tileserver）：HTTP 503
#   - data.gov.tw dataset 7094（部落 GIS 點位）：頁面可讀，但內容顯示「此資料集已下架，現為歷史資料留存」
#     ——這與 SOURCES.yaml 原記載的 status:unverified 不同，是本輪新發現，需更新 SOURCES.yaml（見下）
#   - THCTS 說明頁（gis.rchss.sinica.edu.tw/thcts/）：可讀，但只有平台介紹，無 API／下載說明
# 結論：P6 的「對齊」在本輪實務上受阻——四個目標權威來源，三個 503、一個已下架。
# 這不是本專案方法論的問題，是外部依賴當下不可用。已記入 SOURCES.yaml 與 BACKLOG。
# 本檔案改用可及的次要來源（維基百科消歧義頁）先建立「同名詞底下有幾個不同實體」的骨架，
# 官方代碼與座標留待權威檔恢復後再補——這是誠實的部分完成，不是自建權威檔。

