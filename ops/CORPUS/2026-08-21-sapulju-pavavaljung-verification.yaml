  - claim_id: c-0005
    text: |
      s-0003 與 s-0004 對巴法法瀧家族的開拓時間點與地緣描述**不完全一致**：
      s-0003 敘事聚焦「camak 後人遷至北里溪右岸開墾建部落」，未提及南大武山
      舊賓茂部落的起源；s-0004 則明確記載該家族源自「南大武山『舊賓茂部落』」。
      兩者可能是同一遷移史的不同階段（先自舊賓茂部落遷出，後定居北里溪右岸），
      但本輪未查證兩段敘事的時間銜接，不擅自合併成一條連貫時間線。
