  已累積 3 個時間點的樣本（08-19~21 全擋／08-24 全通／08-25 全擋），方向上支持「間歇性」
  而非「已解除」或「仍然結構性」。**方法論結論（可寫入 METHOD.md）**：NDLTD 詳細頁的
  可讀性應視為每次請求時才能知道的間歇狀態，不能沿用前一輪（甚至前一天）的可讀/不可讀
  判定——每一輪核實都必須當場重試，不能假設昨天讀到的今天還讀得到，也不能假設昨天讀不到
  的以後都讀不到。下一輪若要進一步逼近觸發條件，建議同一天內分早中晚三個時段各測一次
  同一 URL，而非分散在不同天。
