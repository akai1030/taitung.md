claims:
  - claim_id: c-0006
    text: |
      命題 T（台東相對花蓮噶瑪蘭族當代生活缺乏第一人稱記載）的反命題 A（記載
      存在，只是檢索方式找不到）**成立**。s-0001、s-0002 是兩篇獨立（不同記者、
      相隔近兩年、不同事件）、皆直接 WebFetch 全文核對（非 WebSearch 摘要層
      中介）的機構媒體報導，內容包含至少四位具名台東樟原部落噶瑪蘭族／居民
      的第一人稱直接引述，主題涵蓋當代求學記憶、每年返鄉參與文化傳承、教唱
      歌謠給青年世代——這正是 2026-08-08（F8）認定「找不到」的那類內容。
      **推翻原因**：2026-08-08 與本輪稍早的檢索詞組合（「噶瑪蘭族＋青年＋訪談」
      「噶瑪蘭族發展協會＋台東」等）系統性地漏掉了「原住民族電視台／原視新聞網
      機構媒體檔案」這個角度——不是內容不存在，是檢索角度沒有涵蓋機構媒體
      自身的新聞典藏。這與 B-001（2026-08-11）「搜尋介面故障≠資料不可及」
      的教訓同構：這次是「通用網頁搜尋詞組合的盲區≠內容不存在」。
    confidence: attested
    temporal: "2024-07-16 / 2026-05-10"
    spatial_level: settlement

  - claim_id: c-0007
    text: |
      s-0001 稱該傳統領袖為「陳天祿」，s-0002（2024-07-16，較早）稱同一角色
      （樟原部落噶瑪蘭族 Pusia／傳統領袖）為「藤天祿」。兩篇文章對同一職位
      的姓氏記載不一致（陳／藤），名字「天祿」相同。**不確定是否為同一人物**
      （機構媒體轉寫誤植、或確有世代交替的兩位不同人物皆稱天祿），本輪未查證
      銜接關係，依 ENTITIES.md P5 不擅自合併為單一人物實體。
    confidence: disputed
    temporal: null
    spatial_level: null

  - claim_id: c-0008
    text: |
      B-022 窮盡式批次匯出掃描（GRB 570＋NDLTD 800 筆候選，皆以「台東」標題
      篩選）中，僅 1 筆命中噶瑪蘭關鍵詞（歷史主題），0 筆當代主題。**方法論
      意涵**：學位論文／政府研究計畫這類灰色文獻，對「台東噶瑪蘭族當代生活」
      這個主題幾乎是空的（至少在標題層級），真正記載這個主題的管道是機構媒體
      新聞（s-0001、s-0002），不是學術灰色文獻。這修正了 B-027／B-022 系列
      工作隱含的假設——窮盡式掃描灰色文獻不等於窮盡式掃描「當代第一人稱記載」，
      兩者命中的文類完全不同。
    confidence: verified              # B-022 掃描本身已是窮盡式（46/46 年度全掃），此為對既有數據的重新查詢，非新檢索方法
    temporal: null
    spatial_level: null

  - claim_id: c-0009
    text: |
      TITV「噶瑪蘭族」標籤頁近兩年（2024-07 至 2026-08）12 篇報導中，僅 2 篇
      主體在台東（約 17%），其餘皆在花蓮。**這是 F8「記載偏斜」假設的一次
      具體量化佐證**（先前 F8 僅有定性描述「反覆被描述為次要分布地」，未附
      實際比例）——但樣本數小（n=12），且僅涵蓋單一媒體機構的單一標籤頁，
      不足以代表噶瑪蘭族報導的整體分布，只能視為同一方向上的又一個獨立觀察，
      不可過度推論為精確比例。
    confidence: attested
    temporal: "2024-07 至 2026-08"
    spatial_level: county

