claims:
  - claim_id: c-0006
    text: |
      NDLTD 候選論文（s-0001）標題所指涉的核心事實——Pacefongan 確為都歷部落
      傳統海域、地名有明確阿美族語意義（船下水的地方）、且該地當前存在遊客
      使用與部落傳統領域之間的張力（觀光開發／垃圾／尊重呼籲）——在論文之外
      有官方政府網站（s-0003）獨立佐證。
    confidence: attested
    temporal: null
    spatial_level: settlement

  - claim_id: c-0007
    text: |
      論文標題核心主張「正名之聲」（即該地名/傳統領域存在需要「正名」的訴求或
      爭議）**未能被本輪任何獨立來源直接證實**——s-0003（官方觀光網站）完全未
      提及正名或爭議，只講傳統海域用途與旅遊叮嚀；s-0004（媒體報導）方向接近
      但未讀到全文核對。「正名」訴求的具體內容（要正什麼名？向誰訴求？）仍是
