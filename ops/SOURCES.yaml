# B. 灰色文獻入口（METHOD.md §4.2 —— 本專案的核心優勢）
# ─────────────────────────────────────────────
grey_literature:
  - id: grey.grb
    name: GRB 政府研究資訊系統
    url: https://grbsearch.stpi.narl.org.tw/
    role: 政府經費資助之研究計畫與成果報告（收錄最完整）
    why: 台東大量地方知識活在政府委託計畫的結案報告裡，從未被索引
    tier: T5
    priority: highest
    status: degraded          # 搜尋網頁介面壞，但官方開放資料批次匯出可用——見下
    http: 503
    finding: |
      搜尋網頁介面（本欄 url）連續 3 輪 503（2026-08-09／08-10／08-11），依 CHARTER §6
      正式降級。**但 2026-08-11 發現這不等於整個 GRB 不可及**：data.gov.tw dataset 18707
      （政府研究資訊系統(GRB)資料目錄集，82年度~迄今）提供每年一份的官方批次匯出，
      經實測可用，見 alt_access。
    checked: 2026-08-11
    alt_access:
      name: GRB 開放資料批次匯出（非搜尋介面，官方資料集）
      catalog_url: https://data.gov.tw/dataset/18707
      catalog_csv: https://mas.nstc.gov.tw/OPENDATA/GetFile?format=csv&serialno=527&fileodr=1
      format: 每年一個 zip（內含 GRB_<年度>.xml），82年度(1993)~115年度(2026)，34 個檔案
      license: 政府資料開放授權條款-第1版（ogdl-1.0）
      verified: |
        2026-08-11 直接下載並解壓兩個年度驗證：115年度（32MB XML，21230筆，7筆含「台東」）、
        100年度（35MB XML，65筆含「台東」，含 GRB_100 標籤計數，未逐筆確認去重）。
        兩年度皆為結構化欄位（計畫中文名稱、執行單位、研究領域、中英文關鍵詞、摘要URL、全文檔URL），
        非工具摘要層轉述，直接讀取原始 XML——依 METHOD.md §3 判 verified（官方目錄頁 + 實際檔案內容
        兩個獨立來源交叉支持存在性與可用性）。
      not_yet_done: 34 個年度未逐一掃描台東相關筆數；全文檔URL 是否可及未測試（見 BACKLOG）。
    todo: 見 BACKLOG B-001（已轉為新方向：批次匯出系統性掃描）

  - id: grey.ndltd
    name: 臺灣博碩士論文知識加值系統
    url: https://ndltd.ncl.edu.tw/
    tier: T2
    status: degraded          # 搜尋網頁介面壞，但官方開放資料批次匯出可用——見下
    finding: |
      2026-08-09 實測：搜尋網頁介面（本欄 url）送出查詢前即被圖形驗證碼攔截（非單純 session
      問題），判定為結構性不可及。**但 2026-08-11 發現這不等於整個 NDLTD 不可及**：
      官方提供逐學年度 CSV 批次匯出（data.gov.tw dataset 14024），完全不經過搜尋介面／驗證碼，
      見 alt_access。
    checked: 2026-08-11
    alt_access:
      name: NDLTD 開放資料批次匯出（非搜尋介面，官方資料集）
      catalog_url: https://data.gov.tw/dataset/14024
      base_url: https://ndltd.ncl.edu.tw/opendata/<學年度>ndltd.csv
      format: 每學年度一個 CSV，102~113 學年度（約 2013~2024），共 12 個檔案，每年一更
      license: 政府資料開放授權條款-第1版（ogdl-1.0）
      verified: |
        2026-08-11 直接下載並解析 113 學年度 CSV（17.7MB，59071 筆論文），欄位為
        論文名稱(中文/外文)、學校、系所、畢業學年度、學位類別、作者、指導教授、論文網址。
        以「台東」關鍵詞篩選命中 16 筆。102 學年度檔案亦確認可下載（HEAD 200，17.3MB），未解析。
        非工具摘要層轉述，直接讀取原始 CSV——依 METHOD.md §3 判 verified。
      not_yet_done: |
        僅含書目 metadata，不含全文；論文網址（博碩士論文網址欄）指向的頁面是否需登入未測試。
        12 個學年度僅解析 1 個，其餘 11 個未逐一掃描台東相關筆數（見 BACKLOG）。
    action_required: none        # 批次匯出已可直接使用，見 BACKLOG B-001 後續

