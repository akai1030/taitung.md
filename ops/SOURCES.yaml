        機制——確認不可直接 WebFetch。
      round4_2026-08-19: |
        先覆核第2輪 105/108/110 學年度：用雙欄位名容錯腳本獨立重新解析，逐年與總數（216筆）
        與第2輪回報**完全吻合**，F52 的疑慮解除，該數字從 `inferred` 升級為 `verified`。
        再新掃剩餘 5 個學年度（106、107、109、111、112），題名命中 293 筆（106:37／
        107:68／109:80／111:57／112:51），僅校名命中 858 筆已排除。**NDLTD 12/12 學年度
        全數掃完，B-022 結案**。累計候選：第1輪16＋第2輪216＋第3輪275＋第4輪293＝
        **800 筆**。
      remaining: 無（12/12 已全數掃完）
