broken:
  - id: src.cwa-api
    name: 中央氣象署開放資料 API
    url: https://opendata.cwa.gov.tw/
    tier: T1
    status: broken
    finding: |
      .env.local 內的 CWA_API_KEY 已失效：HTTP 401「Authorization key is not correct.」
    correction_2026-08-06: |
      【自我更正】初次記錄時我寫「影響：首頁『此刻的台東』目前是壞的」——那是錯的，且是未經查證的推論。
      實際查 src/ 後確認：整個 codebase 沒有任何 CWA / weather 相關程式碼。
      SeasonMoment.tsx 讀的是 src/lib/season.ts 的靜態季節資料。
      → 正確描述：天氣功能「從未實作」，不是「壞掉」。docs/CLAUDE.md 把它列在技術棧裡，是規劃未落地。
      → 這一則本身是方法論的實例：我從「key 失效」推論出「功能壞掉」，中間隔著一個沒查證的假設。
        依 METHOD §3 這只能標 inferred，我卻當成 verified 寫了出來。
    checked: 2026-08-06
    action_required: human      # 若要實作天氣功能，需人去 opendata.cwa.gov.tw 重新申請 key
    priority: low               # 降級：不是修 bug，是新功能

