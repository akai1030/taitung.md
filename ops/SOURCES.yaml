    finding: |
      2026-08-09 實測：搜尋介面（/Article/Advance）需 JavaScript，全文下載需機構登入。
      但「文章詳情頁」（/Article/Detail/{docid}）的書目 metadata（雙語篇名、作者、期刊、卷期、年月、頁碼、DOI）
