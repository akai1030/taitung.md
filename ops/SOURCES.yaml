      not_yet_done: |
        僅含書目 metadata，不含全文；論文網址（博碩士論文網址欄）指向的頁面**已測試——
        不可直接讀取**，見 round3_2026-08-18。
    scan_progress:
      done: "7/12（102、103、104、105、108、110、113 學年度）"
      round2_2026-08-17: |
        新掃 105／108／110 三個學年度，論文題名命中「台東」／「臺東」216 筆（見
        ops/CORPUS/2026-08-17-grb-ndltd-scan-candidates.md 與同目錄 full.csv）。另有 598 筆
        僅「畢業學校＝國立臺東大學」但題名未命中——依 ENTITIES.md P1 判定為假陽性，未列入候選
        （學校所在地不等於論文主題所在地）。
      round3_2026-08-18: |
        新掃 102／103／104 三個學年度，論文題名命中 275 筆、僅校名命中 1041 筆已排除
        （見 ops/CORPUS/2026-08-18-grb-ndltd-scan-candidates.md）。**重大方法論發現**：
        論文題名欄位名稱在不同學年度不一致——僅 113 學年度用 `論文名稱(中文)`，102 到
        至少 112 學年度（逐一下載 106-112 檔頭確認）全部只用 `論文名稱`。本輪一開始沿用
