grey_literature:
  - id: grey.grb
    name: GRB 政府研究資訊系統
    url: https://grbsearch.stpi.narl.org.tw/
    role: 政府經費資助之研究計畫與成果報告（收錄最完整）
    why: 台東大量地方知識活在政府委託計畫的結案報告裡，從未被索引
    tier: T5
    priority: highest
    status: degraded          # 搜尋網頁介面壞，但官方開放資料批次匯出可用——見下
    http: 503
    finding: |
      搜尋網頁介面（本欄 url）連續 3 輪 503（2026-08-09／08-10／08-11），依 CHARTER §6
      正式降級。**但 2026-08-11 發現這不等於整個 GRB 不可及**：data.gov.tw dataset 18707
      （政府研究資訊系統(GRB)資料目錄集，82年度~迄今）提供每年一份的官方批次匯出，
      經實測可用，見 alt_access。
    checked: 2026-08-11
    alt_access:
      name: GRB 開放資料批次匯出（非搜尋介面，官方資料集）
      catalog_url: https://data.gov.tw/dataset/18707
      catalog_csv: https://mas.nstc.gov.tw/OPENDATA/GetFile?format=csv&serialno=527&fileodr=1
      format: 每年一個 zip（內含 GRB_<年度>.xml），82年度(1993)~115年度(2026)，34 個檔案
      license: 政府資料開放授權條款-第1版（ogdl-1.0）
      verified: |
        2026-08-11 直接下載並解壓兩個年度驗證：115年度（32MB XML，21230筆，7筆含「台東」）、
        100年度（35MB XML，65筆含「台東」，含 GRB_100 標籤計數，未逐筆確認去重）。
        兩年度皆為結構化欄位（計畫中文名稱、執行單位、研究領域、中英文關鍵詞、摘要URL、全文檔URL），
        非工具摘要層轉述，直接讀取原始 XML——依 METHOD.md §3 判 verified（官方目錄頁 + 實際檔案內容
        兩個獨立來源交叉支持存在性與可用性）。
      not_yet_done: |
        全文檔URL／摘要URL 已測試——**不可直接讀取**，見 round3_2026-08-18。
    scan_progress:
      done: "14/34（82~115 年度中的 82、83、84、86、87、88、85、90、95、100、105、110、113、115 年度）"
      round2_2026-08-17: |
        新掃 85／90／95／105／110／113 六個年度，命中 83 筆候選（見 ops/CORPUS/2026-08-17-grb-ndltd-scan-candidates.md）。
        發現：(1) XML schema 在較新年度從 `<GRB05>` 換成 `<row>` 標籤，第一輪（08-11）驗證的 115 年度
        未覆核用的是哪個標籤，7 筆命中數字可能低估；(2) `ABSTRACT_C` 欄位是連到 grb.gov.tw 詳情頁的
        URL，不是摘要全文本身；(3) 部分年度 XML 檔案有格式錯誤，需容錯解析（lxml recover=True）。
      round3_2026-08-18: |
        新掃 82／83／84／86／87／88 六個年度（皆用 `<GRB05>` 標籤），命中 66 筆候選；同時回頭覆核
        115 年度（見 ops/CORPUS/2026-08-18-grb-ndltd-scan-candidates.md）。**F47 的懷疑成立**：
        115 年度用同時支援兩種標籤的腳本重新解析，正確命中數是 **11 筆，不是 7 筆**（原用
        `<GRB05>` 標籤的腳本漏掉 4 筆），已更正上方 `verified` 欄位。**摘要 URL 實測**：直接
        curl 抓取一筆摘要頁 URL（`grb.gov.tw/search/planDetail2?id=19115185`），回傳 HTTP 200
        但內容是 Angular SPA 靜態殼（jQuery/Bootstrap/reCAPTCHA script，無實際摘要文字），
        與 grbsearch.stpi.narl.org.tw 搜尋介面同一套前端架構——**確認不可直接 WebFetch**，
        需 JS 渲染才能讀到內容，B-001 已判定 headless browser 成本過高不做。
      round4_2026-08-19: |
        新掃剩餘 20 個年度（89、91-94、96-99、101-104、106-109、111-112、114），命中 410
        筆候選（見 ops/CORPUS/2026-08-19-grb-ndltd-scan-candidates.md）。**GRB 34/34 年度
        全數掃完，B-022 結案**。**schema 轉換邊界精確定位**：89～106 年度全部用 `<GRB05>`
        標籤，107～115 年度全部用 `<row>` 標籤，轉換點在民國 106／107 年度之間（此前只知
        82-88 用 GRB05、115 用 row，範圍不明）。**正確欄位名修正**：執行單位／ID 欄位長期
        誤用不存在的標籤名（`EXECUTIVE_NAME`／`ORG_NAME`／`SYSNO`／`PROJID`），命中數不受
        影響（篩選用的 `PNCH_DESC`／`KEYWORD_C` 欄位名一直是對的），但候選清單裡這兩欄
        長期是空字串；本輪核對確認正確欄位名是 `ID`／`EXCU_ORGAN_NAME`／`RESEARCH_FIELD`，
        兩種 schema 共用同一組欄位名。累計候選：第1輪11（F50更正後）＋第2輪83＋第3輪66＋
        第4輪410＝**570 筆**。
      remaining: 無（34/34 已全數掃完）
    todo: B-022 已結案（46/46）。後續核實個別候選內容轉入 BACKLOG B-027

