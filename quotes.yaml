  - id: sakinu
    name: 亞榮隆·撒可努
    nameEn: Sakinu Yalonglong
    ethnicity: 排灣族（Paiwan）
    hometown: 台東·太麻里·拉勞蘭部落（Lalauran）
    township: 太麻里鄉
    coordinates: [22.6156, 120.9958]
    born: 1972
    role: 作家、森林警察、獵人學校創辦人
    bio: 撒可努是他的名，意味著動物奔馳與植物蓬勃，象徵萬物生生不息。著作《山豬·飛鼠·撒可努》被哈佛大學選為教材，編入台灣國中、高中課文。2002 年創辦獵人學校。
    awards:
      - 巫永福文學獎
    works:
      - title: 山豬·飛鼠·撒可努
        year: 2000
        type: 散文
        note: 哈佛大學應用中文系教材，改拍電影
      - title: 走風的人：我的獵人父親
        year: 2002
        type: 散文
      - title: 外山的故事
        year: 2011
        type: 散文
    layers: [people, land, education]

