  - id: badai
    name: 巴代
    nameEn: Badai
    hanName: 林二郎
    ethnicity: 卑南族（Puyuma）
    hometown: 台東·大巴六九部落（Damalagaw）
    township: 卑南鄉
    coordinates: [22.7867, 121.0942]
    born: 1962
    role: 小說家
    bio: 以卑南族部落為敘事主體，作品根基於原住民身份與軍旅經驗。寫作中採用「卑—漢」雙語對話形式，先出現卑南語，再輔以中文。
    awards:
      - 台灣文學獎小說金典獎
      - 金鼎獎最佳著作人獎
      - 吳三連獎
