    role: 歌手、音樂創作人、演員、阿米斯音樂節創辦人
    bio: 來自都蘭部落的阿美族創作者。以母語創作的〈不要放棄〉獲金曲獎年度歌曲。不拿補助自辦「阿米斯音樂節」，在「都蘭小巨蛋」（都蘭國小體育館）為部落而唱。
    awards:
      - 金曲獎最佳年度歌曲（2016）
      - 金馬獎最佳新演員（2008）
