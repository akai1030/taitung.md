# ═══════════════════════════════════════
# 語錄
# ═══════════════════════════════════════

quotes:

  # ── 夏曼·藍波安 ──
  - id: q-syaman-01
    author: syaman-rapongan
    text: 我的身體就是海洋文學。
    source: 中央社專訪
    tags: [海洋, 身體, 文學]
    layers: [land, people]

  - id: q-syaman-02
    author: syaman-rapongan
    text: 對我而言，始終是身體先於文學。
    source: 國藝會線上誌
    tags: [海洋, 身體, 創作]
    layers: [people]

  - id: q-syaman-03
    author: syaman-rapongan
    text: 我是住在蘭嶼的海洋文學家，我的文學深受傳統詩歌的影響，深受划船、捕飛魚、鬼頭刀魚、潛水抓魚的影響。
    source: 國藝會線上誌
    tags: [蘭嶼, 海洋, 傳統]
    layers: [people, land, living]

  - id: q-syaman-04
    author: syaman-rapongan
    text: 我的作品絕對不會被認為這是漢人所寫出來的，因為那是出自於海之民族擁有的體悟。
    source: 中央社專訪
    tags: [達悟族, 身份, 文學]
    layers: [people]

  # ── 桑布伊 ──
  - id: q-sangpuy-01
    author: sangpuy
    text: 語言是與土地連結最重要的一環，失去語言，就像離開土地。
    source: 台灣東協造音行動專訪
    tags: [族語, 土地, 文化]
    layers: [people, education]

  - id: q-sangpuy-02
    author: sangpuy
    text: 感謝我的部落給我那麼多養分。
    source: 2021 金曲獎得獎感言
    tags: [部落, 感恩]
    layers: [people, celebration]

  - id: q-sangpuy-03
    author: sangpuy
    text: 我認為必須是自己喜歡的創作、能感動自我的東西，也才有辦法感動別人。
    source: 台灣東協造音行動專訪
    tags: [創作, 音樂]
    layers: [people, youth]

  # ── 舒米恩 ──
  - id: q-suming-01
    author: suming
    text: 文化是整個生活，每一件事情是被扣在一起的，不可能土地賣掉了語言還留著。
    source: 500 輯專訪
    tags: [文化, 土地, 語言, 都蘭]
    layers: [people, living, youth]

  - id: q-suming-02
    author: suming
    text: 我的個子雖小，但我的志願並不小，希望未來能做一首全世界的人都喜歡的歌曲。
    source: 小學四年級作文
    tags: [夢想, 音樂]
    layers: [youth]

  # ── 亞榮隆·撒可努 ──
  - id: q-sakinu-01
    author: sakinu
    text: 山林教育是找回人與自然對話的本能。
    source: 中央社專訪
    tags: [獵人, 自然, 教育]
    layers: [land, education, people]

  # ── 蔣勳 ──
  - id: q-chiang-01
    author: chiang-hsun
    text: 池上給我最大的禮物，是讓我重新學會看雲。
    source: 池上日記
    tags: [池上, 自然, 生活]
    layers: [living, land]

  # ── 孫大川 ──
  - id: q-sun-01
    author: sun-ta-chuan
    text: 原住民文學不是邊緣文學，它是台灣最古老的文學。
    source: 山海世界
    tags: [原住民, 文學]
    layers: [people, knowledge]
